[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "npkext"
version = "0.1.0"
description = "Extractor for NeoX engine NXPK (.npk) archives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "lz4>=4.3",          # LZ4 block decompression (most entries)
    "zstandard>=0.22",   # zstd decompression (compression mode 3)
    "mmh3>=4.0",         # murmur3: entry ids and checksums
    "rich>=13.7",        # terminal UI
    "rich-argparse>=1.4" # coloured --help
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
npkext = "npkext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
